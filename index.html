<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report Builder for WCI Projects</title><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><style>:root{font-family:Arial,Helvetica,sans-serif;color:#203445;background:#f3f6f7}*{box-sizing:border-box}body{margin:0}main{max-width:980px;margin:28px auto;padding:0 18px 40px}header{background:white;border-bottom:4px solid #0a797a;padding:20px max(20px,calc((100vw - 940px)/2));display:flex;gap:20px;align-items:center}header img{max-width:200px;max-height:70px;object-fit:contain}h1{font-size:27px;margin:0}h2{font-size:19px;margin:0 0 20px}section{background:white;border:1px solid #dbe3e8;border-radius:12px;padding:24px;margin:18px 0;box-shadow:0 2px 9px #102f4410}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.field{display:flex;flex-direction:column;gap:7px}.wide{grid-column:1/-1}label,.label{font-size:14px;font-weight:650}input[type=text],input[type=date],select{width:100%;padding:11px;border:1px solid #bac8d1;border-radius:7px;font:inherit}.checks{display:flex;gap:20px;flex-wrap:wrap;padding:10px 0}.checks label{font-weight:400}input[type=checkbox]{accent-color:#087f80;transform:scale(1.1)}button{border:0;background:#087f80;color:white;padding:12px 20px;border-radius:7px;font-weight:700;cursor:pointer}button.secondary{background:#e5f0f1;color:#165458}button:disabled{opacity:.55;cursor:wait}.actions{display:flex;gap:12px;flex-wrap:wrap}.hint{font-size:12px;color:#60727e}.status{white-space:pre-wrap;margin:14px 0;color:#235b5d}.error{color:#b22929}footer{display:flex;justify-content:flex-end}#logoFallback{color:#087f80;font-size:24px;font-weight:800} @media(max-width:650px){.grid{grid-template-columns:1fr}header{flex-wrap:wrap}h1{font-size:23px}}</style></head><body><header><img src="logo.png" alt="Terraphase logo" onerror="this.style.display='none';document.getElementById('logoFallback').hidden=false"><span id="logoFallback" hidden>Terraphase</span><h1>Report Builder for WCI Projects</h1></header><main><section><h2>Import project information</h2><div class="field"><label for="sourcePdf">Open project information PDF</label><input type="file" id="sourcePdf" accept="application/pdf,.pdf"><div class="hint" id="importStatus"></div></div></section><section><h2>Project information</h2><div class="grid"><div class="field wide"><label for="project">What is the project name?</label><input id="project" type="text"></div><div class="field"><label for="sub">What is the Sub name?</label><input id="sub" type="text"></div><div class="field"><label for="pm">What is WCI PM?</label><input id="pm" type="text"></div><div class="field"><label for="sap">What is SAP number?</label><input id="sap" type="text"></div><div class="field"><label for="requestor">Requestor</label><input id="requestor" type="text"></div><div class="field wide"><label for="description">Project description</label><input id="description" type="text"></div><div class="field"><label for="city">City</label><input id="city" type="text"></div><div class="field"><label for="gps">GPS Coordinates</label><input id="gps" type="text"></div><div class="field"><label for="pmPhone">PM phone</label><input id="pmPhone" type="text"></div></div></section><section><h2>Sampling and analytical information</h2><div class="field"><span class="label">What site media sampled?</span><div class="checks"><label><input type="checkbox" id="soil"> Soil</label><label><input type="checkbox" id="concrete"> Concrete</label><label><input type="checkbox" id="asphalt"> Asphalt</label></div></div><div class="field"><span class="label">What analytical suites are needed?</span><div class="checks"><label><input type="checkbox" id="tph" checked> TPH</label><label><input type="checkbox" id="metals" checked> Metals</label><label><input type="checkbox" id="pcbs" checked> PCBs</label><label><input type="checkbox" id="vocs" checked> VOCs</label><label><input type="checkbox" id="svocs"> SVOCs</label></div></div><div class="grid"><div class="field"><label for="repDate">What is the date of the report?</label><div class="actions"><input id="repDate" type="date" style="flex:1"><button type="button" class="secondary" id="today">Today</button></div></div><div class="field"><label for="sampleDate">What was the day of sampling?</label><input id="sampleDate" type="date"></div><div class="field"><label for="photos">How many photos are needed?</label><select id="photos"><option>1</option><option>2</option><option>3</option><option>4</option></select></div></div></section><section><footer><button id="save">Complete and Save</button></footer><div class="status" id="status" role="status"></div></section></main><script>
'use strict';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=id=>document.getElementById(id), val=id=>$(id).value.trim();
const phones={'cem kamali':'(657) 922-5355','christine brendle':'(949) 939-4966','vik mathur':'(714) 728-7546'};
const clean=s=>String(s??'').trim(); const safe=s=>clean(s).replace(/[\\/:*?"<>|]/g,'-').slice(0,140);
function fmtDate(iso,mode='short'){if(!iso)return '';const [y,m,d]=iso.split('-').map(Number);if(!y||!m||!d)return iso;const date=new Date(y,m-1,d);return mode==='long'?date.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}):`${String(m).padStart(2,'0')}/${String(d).padStart(2,'0')}/${y}`}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};$('repDate').value=today();$('today').onclick=()=>{$('repDate').value=today()};
$('pm').addEventListener('input',()=>{$('pmPhone').value=phones[val('pm').toLowerCase()]||''});
function set(id,v){if(v!==undefined&&v!==null&&clean(v))$(id).value=clean(v)}
function parsePdfLines(lines,rows=[]){
 const list=lines.map(clean).filter(Boolean);
 const projectLine=list.find(x=>/\bsub\b/i.test(x)&&!/project number|substation/i.test(x))||list[2]||'';
 if(projectLine){const project=projectLine.replace(/\s+$/,'').replace(/\.*$/,'.');set('project',project);const sm=projectLine.match(/^(.+?)\s+sub\b/i);if(sm)set('sub',sm[1]);}
 // Read values to the right of table labels. PDF text extraction sometimes separates cells.
 function field(re){
  for(let i=0;i<rows.length;i++){
   const row=rows[i],parts=row.parts||[];
   for(let j=0;j<parts.length;j++){
    const txt=clean(parts[j].s);if(!re.test(txt))continue;
    let same=txt.replace(re,'').replace(/^[:\s-]+/,'').trim();
    if(same)return same;
    const right=parts.filter(q=>q.x>parts[j].x+25&&clean(q.s)).sort((a,b)=>a.x-b.x);
    if(right.length)return clean(right.map(q=>q.s).join(' '));
    const next=rows[i+1];if(next&&Math.abs(next.y-row.y)<28)return clean(next.parts.map(q=>q.s).join(' '));
   }
  }
  for(let i=0;i<list.length;i++){const m=list[i].match(re);if(m)return clean(list[i].replace(re,'').replace(/^[:\s-]+/,''))||clean(list[i+1]);}
  return '';
 }
 set('pm',field(/^WCI\s*PM\b\s*[:\-]?/i));
 set('sap',field(/^SAP\s*\/\s*Work\s*Order\b\s*[:\-]?/i));
 set('gps',field(/^GPS\s*Coordinates\b\s*[:\-]?/i));
 set('description',field(/^Project\s*Description\b\s*[:\-]?/i).split(/Project will include:/i)[0].trim());
 const address=field(/^Address\b\s*[:\-]?/i);const city=address.match(/,\s*([^,]+?)\s*,\s*CA\b/i);if(city)set('city',city[1]);
 // Requestor is below the left heading, not the right-hand Site Access Contact.
 const requestRow=rows.find(r=>r.parts.some(p=>/^Requestor Information$/i.test(clean(p.s))));
 if(requestRow){const ix=rows.indexOf(requestRow);const heading=requestRow.parts.find(p=>/^Requestor Information$/i.test(clean(p.s)));const below=rows.slice(ix+1).find(r=>r.y<requestRow.y-2&&r.parts.some(p=>p.x<heading.x+240&&/^[A-Za-z][A-Za-z .'-]+$/.test(clean(p.s))));if(below){const candidate=below.parts.filter(p=>p.x<heading.x+240).sort((a,b)=>a.x-b.x)[0];if(candidate)set('requestor',candidate.s)}}
 if(!val('requestor')){const idx=list.findIndex(x=>/Requestor Information/i.test(x));if(idx>=0){const candidate=(list[idx+1]||'').split(/\s{2,}/)[0];if(candidate&&!/Site Access Contact/i.test(candidate))set('requestor',candidate)}}
 $('pm').dispatchEvent(new Event('input'));
}
$('sourcePdf').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{
 $('importStatus').textContent='Reading PDF...';const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;
 const lines=[],allRows=[];
 for(let n=1;n<=Math.min(pdf.numPages,3);n++){
  const pg=await pdf.getPage(n),tc=await pg.getTextContent();const rows=[];
  for(const item of tc.items){if(!clean(item.str))continue;const y=Math.round(item.transform[5]*2)/2;let row=rows.find(r=>Math.abs(r.y-y)<=2);if(!row){row={y,parts:[]};rows.push(row)}row.parts.push({x:item.transform[4],s:item.str})}
  rows.sort((a,b)=>b.y-a.y);for(const row of rows){row.parts.sort((a,b)=>a.x-b.x);lines.push(row.parts.map(x=>x.s).join(' ').replace(/\s+/g,' ').trim());allRows.push(row)}
 }
 parsePdfLines(lines,allRows);$('importStatus').textContent=`Imported ${f.name}. Please review the fields.`;
 }catch(err){$('importStatus').textContent='Unable to read this PDF: '+err.message}
});
function values(){const media=['soil','concrete','asphalt'].filter(id=>$(id).checked);const join=a=>a.length<3?a.join(' and '):a.slice(0,-1).join(', ')+', and '+a.at(-1);const d={'project name':val('project').replace(/\.*$/,'.'),'sub name':val('sub'),'wci pm':val('pm'),'pm':val('pm'),'pm phone':val('pmPhone'),'sap':val('sap'),'req':val('requestor'),'pd':val('description'),'city':val('city'),'gps':val('gps'),'media1':media[0]||'','media2':media[1]||'','media3':media[2]||'','media':join(media),'tph':+$('tph').checked,'metals':+$('metals').checked,'pcbs':+$('pcbs').checked,'vocs':+$('vocs').checked,'svocs':+$('svocs').checked,'rep date':fmtDate(val('repDate')),'sample date':fmtDate(val('sampleDate')),'photo date':fmtDate(val('sampleDate'),'long'),'photos':Number(val('photos'))};return d}
function replaceTokens(s,d){return String(s).replace(/\[([^\]]+)\]/g,(all,k)=>Object.prototype.hasOwnProperty.call(d,k.trim().toLowerCase())?String(d[k.trim().toLowerCase()]):all)}
function removeSoilText(s,soil){return String(s).replace(/\[soil start\]([\s\S]*?)\[soil end\]/gi,(_,body)=>soil?body:'')}
function processText(s,d){return replaceTokens(removeSoilText(s,!!$('soil').checked),d)}
async function getRoot(name){const r=await fetch(encodeURI(name),{cache:'no-store'});if(!r.ok)throw Error(`${name} unavailable (${r.status}). Publish this file in the same website folder.`);return new Uint8Array(await r.arrayBuffer())}
function cleanSheetRows(ws,start,end){const range=XLSX.utils.decode_range(ws['!ref']||'A1');const n=end-start+1;for(let row=start;row<=range.e.r+1;row++){for(let col=range.s.c;col<=range.e.c;col++){const target=XLSX.utils.encode_cell({r:row-1,c:col});if(row+n<=range.e.r+1){const from=XLSX.utils.encode_cell({r:row+n-1,c:col});if(ws[from])ws[target]={...ws[from]};else delete ws[target]}else delete ws[target]}}range.e.r=Math.max(0,range.e.r-n);ws['!ref']=XLSX.utils.encode_range(range);if(ws['!merges'])return;ws['!merges']=ws['!merges'].filter(m=>m.e.r<start-1||m.s.r>end-1).map(m=>{if(m.s.r>=end){m.s.r-=n;m.e.r-=n}return m})}
function deleteCol(ws,col){const rg=XLSX.utils.decode_range(ws['!ref']||'A1');for(let c=col;c<=rg.e.c;c++)for(let r=rg.s.r;r<=Math.min(rg.e.r,179);r++){const dest=XLSX.utils.encode_cell({r,c});const src=XLSX.utils.encode_cell({r,c:c+1});if(c<rg.e.c&&ws[src])ws[dest]={...ws[src]};else delete ws[dest]}rg.e.c=Math.max(0,rg.e.c-1);ws['!ref']=XLSX.utils.encode_range(rg);if(ws['!cols'])ws['!cols'].splice(col,1);if(ws['!merges'])ws['!merges']=ws['!merges'].filter(m=>!(m.s.c<=col&&m.e.c>=col)).map(m=>{if(m.s.c>col){m.s.c--;m.e.c--}return m})}
function editAnalytical(ws,d){if(!Number(d.svocs))cleanSheetRows(ws,115,180);if(!Number(d.vocs))cleanSheetRows(ws,40,114);const rg=XLSX.utils.decode_range(ws['!ref']||'A1');let cols=[];for(let c=rg.s.c;c<=rg.e.c;c++){const a=ws[XLSX.utils.encode_cell({r:3,c})];const v=String(a?.v??'');if((!$('asphalt').checked&&/AC1/i.test(v))||(!$('concrete').checked&&/C1/i.test(v))||(!$('soil').checked&&/HA1|HA2/i.test(v)))cols.push(c)}for(const c of cols.sort((a,b)=>b-a))deleteCol(ws,c)}
function editWorkbook(data,d,analytical=false){const wb=XLSX.read(data,{type:'array',cellStyles:true,cellFormula:true});for(const name of wb.SheetNames){const ws=wb.Sheets[name];if(analytical)editAnalytical(ws,d);for(const key of Object.keys(ws)){if(key.startsWith('!'))continue;const cell=ws[key];if(cell?.t==='s'||typeof cell?.v==='string'){let v=processText(cell.v,d);if(analytical){if(!Number(d.svocs))v=v.replace(/\/SVOCs|SVOCs:\s*Semi-Volatile Organic Compounds/gi,'');if(!Number(d.vocs))v=v.replace(/VOCs\/SVOCs:\s*DTSC HERO HHRA values for commercial\/industrial soil are denoted by \*, all other values are EPA industrial RSLs|VOCs:\s*Volatile Organic Compounds/gi,'')}cell.v=v;delete cell.w}}}return XLSX.write(wb,{bookType:'xlsx',type:'array',cellStyles:true})}
async function editPdf(data,d){const doc=await PDFLib.PDFDocument.load(data,{ignoreEncryption:false});const form=doc.getForm();const fields=form.getFields();let replaced=0;for(const f of fields){const name=f.getName();const direct=name.match(/^\[([^\]]+)\]$/);const aliases={'project name':'project name','report date':'rep date','sapwo number':'sap','requester':'req','wci project manager':'pm','wci pm':'pm','wci pm phone':'pm phone','project description':'pd','material':'media','materialrow2':'media','materialrow3':'media','material4':'media','materialrow5':'media1','materialrow6':'media2','materialrow7':'media3'};const key=direct?direct[1].trim().toLowerCase():(aliases[name.trim().toLowerCase()]||name.trim().toLowerCase());const match=Object.prototype.hasOwnProperty.call(d,key);try{if(f instanceof PDFLib.PDFTextField){const old=f.getText()||'';const next=processText(old,d);if(next!==old){f.setText(next);replaced++}else if(match){f.setText(String(d[key]));replaced++}}else if(f instanceof PDFLib.PDFCheckBox&&match){Number(d[key])?f.check():f.uncheck();replaced++}else if(f instanceof PDFLib.PDFDropdown&&match){f.select(String(d[key]));replaced++}}catch(err){console.warn('Field not updated',name,err)}}if(!replaced)throw Error('No matching editable PDF fields found. The report template needs fillable AcroForm fields containing mapped placeholders.');return await doc.save()}
async function saveFiles(files){if(window.showDirectoryPicker){const dir=await window.showDirectoryPicker({mode:'readwrite'});for(const [name,bytes] of files){const handle=await dir.getFileHandle(name,{create:true});const stream=await handle.createWritable();await stream.write(bytes);await stream.close()}return}const zip=new JSZip();for(const [name,bytes] of files)zip.file(name,bytes);const blob=await zip.generateAsync({type:'blob'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='WCI_Report_Output.zip';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
$('save').onclick=async()=>{const button=$('save'),status=$('status');button.disabled=true;status.classList.remove('error');try{status.textContent='Preparing output files...';const d=values();if(!d['project name']||!d['sub name']||!d.sap)throw Error('Enter project name, Sub name, and SAP number.');const pdfName=`Edit_${d['sub name']} Sub ${d.sap} WCI Report ${d['rep date'].replaceAll('/','-')}.pdf`;const inputs=['Edit_[sub name] Sub [sap] WCI Report [rep date].pdf',`Photos_${d.photos}.xlsx`,'Figure.xlsx','Analytical_Table.xlsx'];const loaded=await Promise.all(inputs.map(getRoot));const outputs=[];outputs.push([safe(pdfName),await editPdf(loaded[0],d)]);outputs.push([`Photos_${d.photos}_${safe(d['sub name'])}.xlsx`,editWorkbook(loaded[1],d)]);outputs.push([`Figure_${safe(d['sub name'])}.xlsx`,editWorkbook(loaded[2],d)]);outputs.push([`Analytical_Table_${safe(d['sub name'])}.xlsx`,editWorkbook(loaded[3],d,true)]);status.textContent='Choose a folder to save all four files.';await saveFiles(outputs);status.textContent='Completed. Four files generated.'}catch(err){status.classList.add('error');status.textContent=err.message||String(err)}finally{button.disabled=false}};
</script></body></html>
