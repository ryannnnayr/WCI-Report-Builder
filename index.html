<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report Builder for WCI Projects</title><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><style>:root{font-family:Arial,Helvetica,sans-serif;color:#203445;background:#f3f6f7}*{box-sizing:border-box}body{margin:0}main{max-width:980px;margin:28px auto;padding:0 18px 40px}header{background:white;border-bottom:4px solid #0a797a;padding:20px max(20px,calc((100vw - 940px)/2));display:flex;gap:20px;align-items:center}header img{max-width:200px;max-height:70px;object-fit:contain}h1{font-size:27px;margin:0}h2{font-size:19px;margin:0 0 20px}section{background:white;border:1px solid #dbe3e8;border-radius:12px;padding:24px;margin:18px 0;box-shadow:0 2px 9px #102f4410}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.field{display:flex;flex-direction:column;gap:7px}.wide{grid-column:1/-1}label,.label{font-size:14px;font-weight:650}input[type=text],input[type=date],select{width:100%;padding:11px;border:1px solid #bac8d1;border-radius:7px;font:inherit}.checks{display:flex;gap:20px;flex-wrap:wrap;padding:10px 0}.checks label{font-weight:400}input[type=checkbox]{accent-color:#087f80;transform:scale(1.1)}button{border:0;background:#087f80;color:white;padding:12px 20px;border-radius:7px;font-weight:700;cursor:pointer}button.secondary{background:#e5f0f1;color:#165458}button:disabled{opacity:.55;cursor:wait}.actions{display:flex;gap:12px;flex-wrap:wrap}.hint{font-size:12px;color:#60727e}.status{white-space:pre-wrap;margin:14px 0;color:#235b5d}.error{color:#b22929}footer{display:flex;justify-content:flex-end}#logoFallback{color:#087f80;font-size:24px;font-weight:800} @media(max-width:650px){.grid{grid-template-columns:1fr}header{flex-wrap:wrap}h1{font-size:23px}}</style></head><body><header><img src="logo.png" alt="Terraphase logo" onerror="this.style.display='none';document.getElementById('logoFallback').hidden=false"><span id="logoFallback" hidden>Terraphase</span><h1>Report Builder for WCI Projects</h1></header><main><section><h2>Import project information</h2><div class="field"><label for="sourcePdf">Open project information PDF</label><input type="file" id="sourcePdf" accept="application/pdf,.pdf"><div class="hint" id="importStatus"></div></div></section><section><h2>Project information</h2><div class="grid"><div class="field wide"><label for="project">What is the project name?</label><input id="project" type="text"></div><div class="field"><label for="sub">What is the Sub name?</label><input id="sub" type="text"></div><div class="field"><label for="pm">What is WCI PM?</label><input id="pm" type="text"></div><div class="field"><label for="sap">What is SAP number?</label><input id="sap" type="text"></div><div class="field"><label for="requestor">Requestor</label><input id="requestor" type="text"></div><div class="field wide"><label for="description">Project description</label><input id="description" type="text"></div><div class="field"><label for="city">City</label><input id="city" type="text"></div><div class="field"><label for="gps">GPS Coordinates</label><input id="gps" type="text"></div><div class="field"><label for="pmPhone">PM phone</label><input id="pmPhone" type="text"></div></div></section><section><h2>Sampling and analytical information</h2><div class="field"><span class="label">What site media sampled?</span><div class="checks"><label><input type="checkbox" id="soil"> Soil</label><label><input type="checkbox" id="concrete"> Concrete</label><label><input type="checkbox" id="asphalt"> Asphalt</label></div></div><div class="field"><span class="label">What analytical suites are needed?</span><div class="checks"><label><input type="checkbox" id="tph" checked> TPH</label><label><input type="checkbox" id="metals" checked> Metals</label><label><input type="checkbox" id="pcbs" checked> PCBs</label><label><input type="checkbox" id="vocs" checked> VOCs</label><label><input type="checkbox" id="svocs"> SVOCs</label></div></div><div class="grid"><div class="field"><label for="repDate">What is the date of the report?</label><div class="actions"><input id="repDate" type="date" style="flex:1"><button type="button" class="secondary" id="today">Today</button></div></div><div class="field"><label for="sampleDate">What was the day of sampling?</label><input id="sampleDate" type="date"></div><div class="field"><label for="photos">How many photos are needed?</label><select id="photos"><option>1</option><option>2</option><option>3</option><option>4</option></select></div></div></section><section><footer><button id="save">Complete and Save</button></footer><div class="status" id="status" role="status"></div></section></main><div style="max-width:980px;margin:0 auto 35px;padding:0 18px;text-align:center"><a href="pdfconvert.html" style="color:#087f80;font-weight:700;text-decoration:underline">PDF to PNG Crop Tool</a></div><script>
'use strict';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=id=>document.getElementById(id), val=id=>$(id).value.trim();
const phones={'cem kamali':'(657) 922-5355','christine brendle':'(949) 939-4966','vik mathur':'(714) 728-7546'};
const clean=s=>String(s??'').trim(); const safe=s=>clean(s).replace(/[\\/:*?"<>|]/g,'-').slice(0,140);
function fmtDate(iso,mode='short'){if(!iso)return '';const [y,m,d]=iso.split('-').map(Number);if(!y||!m||!d)return iso;const date=new Date(y,m-1,d);return mode==='long'?date.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}):`${String(m).padStart(2,'0')}/${String(d).padStart(2,'0')}/${y}`}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};$('repDate').value=today();$('today').onclick=()=>{$('repDate').value=today()};
$('pm').addEventListener('input',()=>{$('pmPhone').value=phones[val('pm').toLowerCase()]||''});
function set(id,v){if(v!==undefined&&v!==null&&clean(v))$(id).value=clean(v)}
function parsePdfLines(lines,rows=[]){
 const list=lines.map(clean).filter(Boolean);
 const projectLine=list.find(x=>/\bsub\b/i.test(x)&&!/project number|substation/i.test(x))||list[2]||'';
 if(projectLine){const project=projectLine.replace(/\s+$/,'').replace(/\.*$/,'.');set('project',project);const sm=projectLine.match(/^(.+?)\s+sub\b/i);if(sm)set('sub',sm[1]);}
 // Read values to the right of table labels. PDF text extraction sometimes separates cells.
 function field(re){
  for(let i=0;i<rows.length;i++){
   const row=rows[i],parts=row.parts||[];
   for(let j=0;j<parts.length;j++){
    const txt=clean(parts[j].s);if(!re.test(txt))continue;
    let same=txt.replace(re,'').replace(/^[:\s-]+/,'').trim();
    if(same)return same;
    const right=parts.filter(q=>q.x>parts[j].x+25&&clean(q.s)).sort((a,b)=>a.x-b.x);
    if(right.length)return clean(right.map(q=>q.s).join(' '));
    const next=rows[i+1];if(next&&Math.abs(next.y-row.y)<28)return clean(next.parts.map(q=>q.s).join(' '));
   }
  }
  for(let i=0;i<list.length;i++){const m=list[i].match(re);if(m)return clean(list[i].replace(re,'').replace(/^[:\s-]+/,''))||clean(list[i+1]);}
  return '';
 }
 set('pm',field(/^WCI\s*PM\b\s*[:\-]?/i));
 set('sap',field(/^SAP\s*\/\s*Work\s*Order\b\s*[:\-]?/i));
 set('gps',field(/^GPS\s*Coordinates\b\s*[:\-]?/i));
 set('description',field(/^Project\s*Description\b\s*[:\-]?/i).split(/Project will include:/i)[0].trim());
 const address=field(/^Address\b\s*[:\-]?/i);const city=address.match(/,\s*([^,]+?)\s*,\s*CA\b/i);if(city)set('city',city[1]);
 // Requestor is below the left heading, not the right-hand Site Access Contact.
 const requestRow=rows.find(r=>r.parts.some(p=>/^Requestor Information$/i.test(clean(p.s))));
 if(requestRow){const ix=rows.indexOf(requestRow);const heading=requestRow.parts.find(p=>/^Requestor Information$/i.test(clean(p.s)));const below=rows.slice(ix+1).find(r=>r.y<requestRow.y-2&&r.parts.some(p=>p.x<heading.x+240&&/^[A-Za-z][A-Za-z .'-]+$/.test(clean(p.s))));if(below){const candidate=below.parts.filter(p=>p.x<heading.x+240).sort((a,b)=>a.x-b.x)[0];if(candidate)set('requestor',candidate.s)}}
 if(!val('requestor')){const idx=list.findIndex(x=>/Requestor Information/i.test(x));if(idx>=0){const candidate=(list[idx+1]||'').split(/\s{2,}/)[0];if(candidate&&!/Site Access Contact/i.test(candidate))set('requestor',candidate)}}
 $('pm').dispatchEvent(new Event('input'));
}
$('sourcePdf').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{
 $('importStatus').textContent='Reading PDF...';const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;
 const lines=[],allRows=[];
 for(let n=1;n<=Math.min(pdf.numPages,3);n++){
  const pg=await pdf.getPage(n),tc=await pg.getTextContent();const rows=[];
  for(const item of tc.items){if(!clean(item.str))continue;const y=Math.round(item.transform[5]*2)/2;let row=rows.find(r=>Math.abs(r.y-y)<=2);if(!row){row={y,parts:[]};rows.push(row)}row.parts.push({x:item.transform[4],s:item.str})}
  rows.sort((a,b)=>b.y-a.y);for(const row of rows){row.parts.sort((a,b)=>a.x-b.x);lines.push(row.parts.map(x=>x.s).join(' ').replace(/\s+/g,' ').trim());allRows.push(row)}
 }
 parsePdfLines(lines,allRows);$('importStatus').textContent=`Imported ${f.name}. Please review the fields.`;
 }catch(err){$('importStatus').textContent='Unable to read this PDF: '+err.message}
});
function values(){const media=['soil','concrete','asphalt'].filter(id=>$(id).checked);const join=a=>a.length<3?a.join(' and '):a.slice(0,-1).join(', ')+', and '+a.at(-1);const d={'project name':val('project').replace(/\.*$/,'.'),'sub name':val('sub'),'wci pm':val('pm'),'pm':val('pm'),'pm phone':val('pmPhone'),'sap':val('sap'),'req':val('requestor'),'pd':val('description'),'city':val('city'),'gps':val('gps'),'media1':media[0]||'','media2':media[1]||'','media3':media[2]||'','media':join(media),'tph':+$('tph').checked,'metals':+$('metals').checked,'pcbs':+$('pcbs').checked,'vocs':+$('vocs').checked,'svocs':+$('svocs').checked,'rep date':fmtDate(val('repDate')),'sample date':fmtDate(val('sampleDate')),'photo date':fmtDate(val('sampleDate'),'long'),'photos':Number(val('photos'))};return d}
function replaceTokens(s,d){return String(s).replace(/\[([^\]]+)\]/g,(all,k)=>Object.prototype.hasOwnProperty.call(d,k.trim().toLowerCase())?String(d[k.trim().toLowerCase()]):all)}
function removeSoilText(s,soil){return String(s).replace(/\[soil start\]([\s\S]*?)\[soil end\]/gi,(_,body)=>soil?body:'')}
function processText(s,d){return replaceTokens(removeSoilText(s,!!$('soil').checked),d)}
async function getRoot(name){const r=await fetch(encodeURI(name),{cache:'no-store'});if(!r.ok)throw Error(`${name} unavailable (${r.status}). Publish this file in the same website folder.`);return new Uint8Array(await r.arrayBuffer())}
// Lossless XLSX editing: patch only text nodes inside the original OOXML package.
// NEVER read/write the workbook with SheetJS: its community writer discards formatting.
function xmlEscapeText(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function xmlUnescapeText(s){const el=new DOMParser().parseFromString('<r>'+s+'</r>','application/xml').documentElement;return el.textContent}
function replaceXmlText(xml,d,analytical){
  // Shared strings, inline strings, and string-formula results all use <t> elements.
  // Preserve every tag and attribute byte-for-byte except the text payload.
  return xml.replace(/(<(?:[A-Za-z_][\w.-]*:)?t\b[^>]*>)([\s\S]*?)(<\/(?:[A-Za-z_][\w.-]*:)?t>)/g,(all,open,body,close)=>{
    if(body.includes('<'))return all;
    const original=xmlUnescapeText(body);
    let value=processText(original,d);
    if(analytical){
      if(!Number(d.svocs))value=value.replace(/\/SVOCs|SVOCs:\s*Semi-Volatile Organic Compounds/gi,'');
      if(!Number(d.vocs))value=value.replace(/VOCs\/SVOCs:\s*DTSC HERO HHRA values for commercial\/industrial soil are denoted by \*, all other values are EPA industrial RSLs|VOCs:\s*Volatile Organic Compounds/gi,'');
    }
    return value===original?all:open+xmlEscapeText(value)+close;
  });
}
// Structural edits are confined to the analytical table worksheet. The original
// OOXML package is retained, including all styles, drawings, and print metadata.
function colNum(s){let n=0;for(const ch of s.toUpperCase())n=n*26+ch.charCodeAt(0)-64;return n}
function colName(n){let s='';while(n>0){n--;s=String.fromCharCode(65+n%26)+s;n=Math.floor(n/26)}return s}
function parseCellRef(ref){const m=String(ref).match(/^(\$?)([A-Z]+)(\$?)(\d+)$/i);return m?{c:colNum(m[2]),r:+m[4],ac:m[1],ar:m[3]}:null}
function changeRef(ref,removedCols,removedRows,changeColumns=true){const p=parseCellRef(ref);if(!p)return ref;
 const before=removedRows.filter(([lo,hi])=>hi<p.r).reduce((n,[lo,hi])=>n+hi-lo+1,0);
 const within=removedRows.some(([lo,hi])=>p.r>=lo&&p.r<=hi);
 if(within)return null;
 const shiftedRow=p.r-before;
 if(!changeColumns||p.r>181)return `${p.ac}${colName(p.c)}${p.ar}${shiftedRow}`;
 if(removedCols.includes(p.c))return null;
 const shiftedCol=p.c-removedCols.filter(c=>c<p.c).length;
 return `${p.ac}${colName(shiftedCol)}${p.ar}${shiftedRow}`;
}
function editAnalyticalSheet(xml,d){
 const dom=new DOMParser().parseFromString(xml,'application/xml');
 if(dom.getElementsByTagName('parsererror').length)throw Error('Invalid analytical worksheet XML');
 const ns='http://schemas.openxmlformats.org/spreadsheetml/2006/main';
 const sheetData=dom.getElementsByTagNameNS(ns,'sheetData')[0];if(!sheetData)throw Error('Analytical table sheetData missing');
 const rows=[...sheetData.getElementsByTagNameNS(ns,'row')];
 const head=rows.find(r=>r.getAttribute('r')==='4');
 if(!head)throw Error('Analytical table sample header (row 4) not found');
  const cols=[];
 for(const cell of [...head.getElementsByTagNameNS(ns,'c')]){
  const ref=parseCellRef(cell.getAttribute('r'));if(!ref)continue;
  const texts=[...cell.getElementsByTagNameNS(ns,'t')].map(t=>t.textContent).join('');
  let value=texts;
  if(!value&&cell.getAttribute('t')==='s'){
   const v=cell.getElementsByTagNameNS(ns,'v')[0];value=window.__analyticalShared?.[Number(v?.textContent)]||'';
  }
  const v=value.toLowerCase();
  if((!d.media.toLowerCase().includes('asphalt')&&v.includes('ac1'))||
     (!d.media.toLowerCase().includes('concrete')&&/\bc1\b/.test(v))||
     (!d.media.toLowerCase().includes('soil')&&/ha[12]/.test(v)))cols.push(ref.c);
 }
 const removedCols=[...new Set(cols)].sort((a,b)=>a-b);
 const removedRows=[];
 if(!Number(d.vocs))removedRows.push([40,114]);
 if(!Number(d.svocs))removedRows.push([115,180]);
 for(const row of rows){
  const originalRow=Number(row.getAttribute('r'));
  if(removedRows.some(([lo,hi])=>originalRow>=lo&&originalRow<=hi)){sheetData.removeChild(row);continue}
  const newRow=changeRef('A'+originalRow,[],removedRows,false);
  row.setAttribute('r',String(parseCellRef(newRow).r));
  for(const cell of [...row.getElementsByTagNameNS(ns,'c')]){
   const old=cell.getAttribute('r');const next=changeRef(old,removedCols,removedRows);
   if(!next){row.removeChild(cell);continue}
   cell.setAttribute('r',next);
   // Do not change formulas: stop instead of silently corrupting references.
   if(cell.getElementsByTagNameNS(ns,'f').length&&(removedCols.length||removedRows.length))
     throw Error('Analytical table contains formulas. Structural edits need a formula-aware implementation.');
  }
 }
 // Adjust merged ranges; never delete footnote text. Skip merges intersecting a
 // deleted row/column, since Excel would otherwise reject invalid ranges.
 for(const container of [...dom.getElementsByTagNameNS(ns,'mergeCells')]){
  for(const merge of [...container.getElementsByTagNameNS(ns,'mergeCell')]){
   const [start,end]=merge.getAttribute('ref').split(':');
   const aa=changeRef(start,removedCols,removedRows),bb=changeRef(end||start,removedCols,removedRows);
   if(!aa||!bb){container.removeChild(merge);continue}
   merge.setAttribute('ref',aa===bb?aa:aa+':'+bb);
  }
  container.setAttribute('count',String(container.getElementsByTagNameNS(ns,'mergeCell').length));
 }
 // Keep the worksheet dimension accurate, including notes below the table.
 const dimension=dom.getElementsByTagNameNS(ns,'dimension')[0];
 if(dimension){const last=Math.max(...rows.filter(r=>r.parentNode===sheetData).map(r=>+r.getAttribute('r')),1);
 dimension.setAttribute('ref',`A1:BI${last}`)}
 // Any original sample column widths and style definitions remain untouched;
 // styles move with each cell, so table borders and fills follow the data.
 return new XMLSerializer().serializeToString(dom);
}
async function editWorkbook(data,d,analytical=false){
 const zip=await JSZip.loadAsync(data);
 const sharedPath='xl/sharedStrings.xml';
 if(analytical&&zip.file(sharedPath)){
  const sharedXml=await zip.file(sharedPath).async('string');
  const sharedDoc=new DOMParser().parseFromString(sharedXml,'application/xml');
  const ns='http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  window.__analyticalShared=[...sharedDoc.getElementsByTagNameNS(ns,'si')].map(si=>si.textContent);
 }
 const paths=Object.keys(zip.files).filter(p=>p==='xl/sharedStrings.xml'||/^xl\/worksheets\/sheet\d+\.xml$/i.test(p));
 for(const path of paths){
  const old=await zip.file(path).async('string');
  let updated=replaceXmlText(old,d,analytical);
  if(analytical&&/^xl\/worksheets\/sheet\d+\.xml$/i.test(path)){
   // Only the worksheet whose row 4 contains sample IDs is structurally edited.
   const row4=updated.match(/<row\b[^>]*\br="4"[^>]*>[\s\S]*?<\/row>/);
   const hasSamples=row4&&(/HA1|HA2|AC1|C1/i.test(row4[0])||window.__analyticalShared?.some(v=>/HA1|HA2|AC1/i.test(v)));
   if(hasSamples)updated=editAnalyticalSheet(updated,d);
  }
  if(updated!==old)zip.file(path,updated);
 }
 delete window.__analyticalShared;
 return new Uint8Array(await zip.generateAsync({type:'uint8array',compression:'DEFLATE'}));
}
async function editPdf(data,d){const doc=await PDFLib.PDFDocument.load(data,{ignoreEncryption:false});const form=doc.getForm();const fields=form.getFields();let replaced=0;for(const f of fields){const name=f.getName();const direct=name.match(/^\[([^\]]+)\]$/);const aliases={'project name':'project name','report date':'rep date','sapwo number':'sap','requester':'req','wci project manager':'pm','wci pm':'pm','wci pm phone':'pm phone','project description':'pd','material':'media','materialrow2':'media','materialrow3':'media','material4':'media','materialrow5':'media1','materialrow6':'media2','materialrow7':'media3'};const key=direct?direct[1].trim().toLowerCase():(aliases[name.trim().toLowerCase()]||name.trim().toLowerCase());const match=Object.prototype.hasOwnProperty.call(d,key);try{if(f instanceof PDFLib.PDFTextField){const old=f.getText()||'';const next=processText(old,d);if(next!==old){f.setText(next);replaced++}else if(match){f.setText(String(d[key]));replaced++}if(/^material(?:row[23567]|4)?$/i.test(name))f.setFontSize(12)}else if(f instanceof PDFLib.PDFCheckBox&&match){Number(d[key])?f.check():f.uncheck();replaced++}else if(f instanceof PDFLib.PDFDropdown&&match){f.select(String(d[key]));replaced++}}catch(err){console.warn('Field not updated',name,err)}}if(!replaced)throw Error('No matching editable PDF fields found. The report template needs fillable AcroForm fields containing mapped placeholders.');return await doc.save()}
async function saveFiles(files){if(window.showDirectoryPicker){const dir=await window.showDirectoryPicker({mode:'readwrite'});for(const [name,bytes] of files){const handle=await dir.getFileHandle(name,{create:true});const stream=await handle.createWritable();await stream.write(bytes);await stream.close()}return}const zip=new JSZip();for(const [name,bytes] of files)zip.file(name,bytes);const blob=await zip.generateAsync({type:'blob'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='WCI_Report_Output.zip';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
$('save').onclick=async()=>{const button=$('save'),status=$('status');button.disabled=true;status.classList.remove('error');try{status.textContent='Preparing output files...';const d=values();if(!d['project name']||!d['sub name']||!d.sap)throw Error('Enter project name, Sub name, and SAP number.');const pdfName=`Edit_${d['sub name']} Sub ${d.sap} WCI Report ${d['rep date'].replaceAll('/','-')}.pdf`;const inputs=['Edit_[sub name] Sub [sap] WCI Report [rep date].pdf',`Photos_${d.photos}.xlsx`,'Figure.xlsx','Analytical_Table.xlsx'];const loaded=await Promise.all(inputs.map(getRoot));const outputs=[];outputs.push([safe(pdfName),await editPdf(loaded[0],d)]);outputs.push([`Photos_${d.photos}_${safe(d['sub name'])}.xlsx`,await editWorkbook(loaded[1],d)]);outputs.push([`Figure_${safe(d['sub name'])}.xlsx`,await editWorkbook(loaded[2],d)]);outputs.push([`Analytical_Table_${safe(d['sub name'])}.xlsx`,await editWorkbook(loaded[3],d,true)]);status.textContent='Choose a folder to save all four files.';await saveFiles(outputs);status.textContent='Completed. Four files generated.'}catch(err){status.classList.add('error');status.textContent=err.message||String(err)}finally{button.disabled=false}};
</script></body></html>
