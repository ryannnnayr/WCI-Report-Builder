  return /\/[^\s]+\s+[\d.+-]+\s+Tf\b/.test(original)?original.replace(/(\/[^\s]+)\s+[\d.+-]+\s+Tf\b/g,`$1 ${size} Tf`):original+` /Helv ${size} Tf`;
 };
 field.acroField.setDefaultAppearance(rewrite(field.acroField.getDefaultAppearance()));
 for(const widget of field.acroField.getWidgets()){
  const entry=widget.dict.lookupMaybe(PDFLib.PDFName.of('DA'),PDFLib.PDFString,PDFLib.PDFHexString);
  if(entry)widget.dict.set(PDFLib.PDFName.of('DA'),PDFLib.PDFString.of(rewrite(entry.decodeText())));
 }
}
function isMaterial(name){return /^material(?:\s*row)?\s*\d*$/i.test(name.trim());}
function soilFieldValues(fields,soil){
 // Apply paired markers across editable fields as well as within a single field.
 const original=fields.map(f=>f.getText()||''),joined=original.join('\u0000');
 const opening=(joined.match(/\[soil start\]/gi)||[]).length,closing=(joined.match(/\[soil end\]/gi)||[]).length;
 if(opening!==closing)throw Error('The PDF contains unmatched soil section markers. Check the report template.');
 let inside=false;
 return original.map(text=>{
  let out='',cursor=0;const markers=/\[soil (start|end)\]/gi;let m;
  while((m=markers.exec(text))){
   if(soil||!inside)out+=text.slice(cursor,m.index);
   if(m[1].toLowerCase()==='start'){if(inside)throw Error('The PDF contains nested soil markers. Check the report template.');inside=true;}
   else{if(!inside)throw Error('A soil end marker appears before its start marker. Check the report template.');inside=false;}
   cursor=m.index+m[0].length;
  }
  if(soil||!inside)out+=text.slice(cursor);return out;
 });
}
async function editPdf(data,d){
 const doc=await PDFLib.PDFDocument.load(data,{ignoreEncryption:false}),form=doc.getForm(),fields=form.getFields();
 const aliases={'report date':'rep date','sapwo number':'sap','requester':'req','requestor':'req','wci project manager':'pm','wci pm':'pm','wci pm phone':'pm phone','project description':'pd','material':'media','materialrow2':'media','materialrow3':'media','material4':'media','materialrow4':'media','materialrow5':'media1','materialrow6':'media2','materialrow7':'media3','filename':'file name','file name':'file name'};
 // Page order and top-to-bottom widget positions determine cross-field sections.
 const pageRefs=doc.getPages().map(p=>p.ref.toString());
 const textFields=fields.filter(f=>f instanceof PDFLib.PDFTextField).sort((a,b)=>{
  const aw=a.acroField.getWidgets()[0],bw=b.acroField.getWidgets()[0];
  const ai=aw? pageRefs.indexOf(aw.P()?.toString()):0,bi=bw?pageRefs.indexOf(bw.P()?.toString()):0;
  return ai-bi||((bw?.getRectangle().y||0)-(aw?.getRectangle().y||0))||((aw?.getRectangle().x||0)-(bw?.getRectangle().x||0));
 });
 const soilTexts=soilFieldValues(textFields,!!$('soil').checked),updatedText=new Set();let replaced=0;
 for(const f of fields){
  const name=f.getName(),direct=name.match(/^\[([^\]]+)\]$/),normalized=name.trim().toLowerCase();
  const key=direct?direct[1].trim().toLowerCase():(aliases[normalized]||normalized),match=Object.prototype.hasOwnProperty.call(d,key);
  // Analytical PCBs is an input flag, never a value for the PCB report column.
  // Keep PCB-column values and appearances; only their final font size becomes Auto.
  if(/^pcbs?(?:\s*\d+)?$/i.test(normalized)||/^pcb\s*impacted(?:\s*\d+)?$/i.test(normalized))continue;
  try{
   if(f instanceof PDFLib.PDFTextField){
    const old=f.getText()||'',base=soilTexts[textFields.indexOf(f)];
    let next=replaceTokens(base,d);
    if(next===old&&match)next=String(d[key]);
    if(next!==old){f.setText(next);updatedText.add(f);replaced++;}
    // Auto means 0 Tf in /DA for every text field, including Material.
    fieldDefaultSize(f,0);
    if(isMaterial(name))updatedText.add(f);
   }else if(f instanceof PDFLib.PDFCheckBox&&match){Number(d[key])?f.check():f.uncheck();replaced++;}
   else if((f instanceof PDFLib.PDFDropdown||f instanceof PDFLib.PDFOptionList)&&match){
    const target=f.getOptions().find(v=>v.toLowerCase()===String(d[key]).toLowerCase());
    if(target===undefined)throw Error(`No option matches ${d[key]}`);f.select(target);replaced++;
   }
  }catch(error){throw Error(`Unable to update PDF field “${name}”: ${error.message}`);}
 }
 if(!replaced)throw Error('No matching editable PDF fields found. The report template needs fillable AcroForm fields containing mapped placeholders.');
 const font=await doc.embedFont(PDFLib.StandardFonts.Helvetica);
 // Regenerate only changed text fields. Unmapped table columns retain their
 // original text and appearance streams. Then restore Auto on all text fields.
 for(const f of updatedText)f.updateAppearances(font);
 for(const f of fields)if(f instanceof PDFLib.PDFTextField)fieldDefaultSize(f,0);
 return await doc.save({updateFieldAppearances:false});
}
async function chooseDestination(){
 if(window.showDirectoryPicker)return {directory:await window.showDirectoryPicker({mode:'readwrite'})};
 if(window.showSaveFilePicker)return {file:await window.showSaveFilePicker({suggestedName:'WCI_Report_Output.zip',types:[{description:'Report output ZIP',accept:{'application/zip':['.zip']}}]})};
 return {};
}
async function saveFiles(files,destination={}){
 if(destination.directory){for(const [name,bytes]of files){const handle=await destination.directory.getFileHandle(name,{create:true});const stream=await handle.createWritable();await stream.write(bytes);await stream.close();}return;}
 const zip=new JSZip();for(const [name,bytes]of files)zip.file(name,bytes);const blob=await zip.generateAsync({type:'blob'});
 if(destination.file){const stream=await destination.file.createWritable();await stream.write(blob);await stream.close();return;}
 const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='WCI_Report_Output.zip';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);
}

$('save').onclick=async()=>{const button=$('save'),status=$('status');button.disabled=true;status.classList.remove('error');try{status.textContent='Preparing output files...';const d=values();if(!d['project name']||!d['sub name']||!d.sap)throw Error('Enter project name, Sub name, and SAP number.');const pdfName=`Edit_${d['sub name']} Sub ${d.sap} WCI Report ${d['rep date'].replaceAll('/','-')}.pdf`;d['file name']=safe(pdfName);const destination=await chooseDestination();const inputs=['Edit_[sub name] Sub [sap] WCI Report [rep date].pdf',`Photos_${d.photos}.xlsx`,'Figure.xlsx','Analytical_Table.xlsx'];const loaded=await Promise.all(inputs.map(getRoot));const outputs=[];outputs.push([safe(pdfName),await editPdf(loaded[0],d)]);outputs.push([`Photos_${d.photos}_${safe(d['sub name'])}.xlsx`,await editWorkbook(loaded[1],d)]);outputs.push([`Figure_${safe(d['sub name'])}.xlsx`,await editWorkbook(loaded[2],d)]);outputs.push([`Analytical_Table_${safe(d['sub name'])}.xlsx`,await editWorkbook(loaded[3],d,true)]);status.textContent='Saving output files...';await saveFiles(outputs,destination);status.textContent='Completed. Four files generated.'}catch(err){status.classList.add('error');status.textContent=err.name==='AbortError'?'Save cancelled.':err.message||String(err)}finally{button.disabled=false}};
</script></body></html>
